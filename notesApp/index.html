<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link rel="stylesheet" href="style.css">
    <script src="libs/stack.js" defer></script>
    <script src="libs/functions.js" defer></script>
    <script src="libs/config.js" defer></script>
    <script src="script.js" defer></script>
</head>
<body>
    <div id="addNewNoteBg">
        <div id="addNewNote">
            <div id="dialogHeader">
                <div id="editId" style="display:none;"></div>
                <h2 id="dialogTitle" class="margins"></h2>
                <button type="button" class="closeBtn" onclick="closeDialog(addNewNoteBg)">X</button>
            </div>
            <div id="dialogContent">
                <input type="text" id="noteTitle" class="inputs margins" placeholder="">
                <br>
                <textarea id="noteContentInput" class="inputs margins" placeholder=""></textarea>
            </div>
            <div id="dialogMenu">
                <button type="button" id="cancelBtn" class="buttons" onclick="closeDialog(addNewNoteBg)"></button>
                <button type="button" id="SaveBtn" class="buttons"
                    onclick='saveNote(
                        document.getElementById("noteTitle").value,
                        document.getElementById("noteContentInput").value,
                        document.getElementById("editId").textContent
                    )'>
                </button>
            </div>
        </div>
    </div>
    <div id="settingsBg">
        <div style="display:flex; flex-direction: row; justify-content:space-between;">
            <h2 id="pageTitle"></h2>
            <button type="button" class="closeBtn buttons" onclick="closeDialog(settingsBg)">X</button>
        </div>
            <label class="selectLabels" for="langSelect"></label>
            <select id="langSelect" class="selects">
                <option value="el"></option>
                <option value="en"></option>
            </select>
            <label class="selectLabels" for="themeSelect"></label>
            <select id="themeSelect" class="selects">
                <option value="default"></option>
                <option value="light"></option>
                <option value="dark"></option>
            </select>
            <label class="selectLabels" for="sortNotes"></label>
            <select id="sortNotes" class="selects">
                <option value="atoz"></option>
                <option value="ztoa"></option>
            </select>

        <button id="deleteAll" class="buttons" onclick="confirmReset()"></button>
    </div>
    <div id="container">
        <div id="header">
            <h1 id="title"></h1>
            <div class="btnDiv">
                <button type="button" id="noteBtn" class="btns"><ion-icon class="icons" name="add-outline"></ion-icon></button>
                <button type="button" id="settingsBtn" class="btns"><ion-icon class="icons" name="settings-outline"></ion-icon></button>
            </div>
        </div>
        <div id="content"></div>
    </div>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</body>
</html>
